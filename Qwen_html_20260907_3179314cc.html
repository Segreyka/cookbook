<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рецепты">
<meta name="theme-color" content="#c1121f">
<title>Кулинарная книга</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{overscroll-behavior-y:contain;touch-action:manipulation;scroll-behavior:smooth;}
button,input,summary,textarea{touch-action:manipulation;}
body{--bg:#fff4e8;--card:#fff;--text:#3c1a12;--sub:#b06a45;--border:#f6ddc4;--accent:#e5383b;--accent2:#ff8500;--header-grad:linear-gradient(135deg,#c1121f,#ff8500);--header-text:#fff;--input-bg:#fff1e0;--input-border:#ffc79b;--input-text:#c1121f;--spice-bg:#ffe8cc;--spice-border:#ff9e42;--spice-text:#b34700;--warn-bg:#ffe5d0;--warn-border:#ff7b00;--warn-text:#c1440e;--radius:16px;--card-border:1px solid transparent;--card-shadow:0 4px 14px rgba(197,58,20,.16);--btn-shadow:0 6px 16px rgba(229,56,59,.35);--head-glow:none;background:var(--bg);color:var(--text);padding-bottom:50px;transition:background .3s,color .3s;}
body.theme-dark{--bg:#060606;--card:#141414;--text:#fafafa;--sub:#9a9a9a;--border:#2b2b2b;--accent:#ff1744;--accent2:#ffab00;--header-grad:linear-gradient(135deg,#0a0a0a,#2b000a);--header-text:#ff1744;--input-bg:#1e1e1e;--input-border:#3d3d3d;--input-text:#ff5c7a;--spice-bg:#1c1410;--spice-border:#4a2c00;--spice-text:#ffab00;--warn-bg:#2a1200;--warn-border:#ff6d00;--warn-text:#ffab00;--radius:12px;--card-border:1px solid #2b2b2b;--card-shadow:0 0 0 1px #2b2b2b,0 0 26px rgba(255,23,68,.22);--btn-shadow:0 0 18px rgba(255,23,68,.55);--head-glow:0 0 18px rgba(255,23,68,.9);background-color:#060606;}
body.theme-asian{--bg:#4d000a;--card:#fff3d0;--text:#4a0d0d;--sub:#a06a1a;--border:#eed391;--accent:#d90429;--accent2:#ffb700;--header-grad:linear-gradient(135deg,#6a040f,#d90429);--header-text:#ffd60a;--input-bg:#fff8e1;--input-border:#e6b800;--input-text:#9d0208;--spice-bg:#ffefc2;--spice-border:#e6b800;--spice-text:#9d6500;--warn-bg:#ffe5b4;--warn-border:#e69500;--warn-text:#9d5200;--radius:14px;--card-border:2px solid #ffb700;--card-shadow:0 6px 18px rgba(0,0,0,.45);--btn-shadow:0 6px 16px rgba(217,4,41,.45);--head-glow:0 0 16px rgba(255,214,10,.6);background-color:#4d000a;background-image:repeating-linear-gradient(45deg,rgba(255,183,0,.08) 0 2px,transparent 2px 24px);}
body.theme-eco{--bg:#f1fbe9;--card:#fff;--text:#173410;--sub:#6f9a5e;--border:#d8efc8;--accent:#2f9e44;--accent2:#ff922b;--header-grad:linear-gradient(140deg,#2b8a3e,#94d82d);--header-text:#fff;--input-bg:#f0fbe6;--input-border:#a9d98a;--input-text:#2b8a3e;--spice-bg:#e6f9d8;--spice-border:#8ece62;--spice-text:#2b7a1f;--warn-bg:#fff0dc;--warn-border:#ff922b;--warn-text:#c05c00;--radius:22px;--card-border:1px solid #e0f2cf;--card-shadow:0 6px 18px rgba(47,158,68,.18);--btn-shadow:0 6px 16px rgba(47,158,68,.35);--head-glow:none;background-color:#f1fbe9;}
.header{position:sticky;top:0;z-index:50;background:var(--header-grad);color:var(--header-text);padding:18px 16px 14px;text-align:center;border-radius:0 0 24px 24px;box-shadow:0 4px 20px rgba(0,0,0,.2);}
.header h1{font-size:21px;margin-bottom:4px;font-weight:700;}
.header p{font-size:12px;opacity:.9;}
.ver{position:absolute;top:12px;right:16px;font-size:11px;opacity:.8;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px;font-weight:600;}
.back-btn{position:absolute;top:12px;left:16px;background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;display:none;}
.theme-switch{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
.t-btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;user-select:none;}
.t-btn.active{background:#fff;color:#333;border-color:#fff;}
.screen{display:none;}
.screen.active{display:block;animation:fadeIn .3s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.search-wrap{margin:16px 16px 8px;}
.search-wrap input{width:100%;padding:12px 16px;border-radius:16px;border:1.5px solid var(--input-border);background:var(--input-bg);color:var(--input-text);font-size:15px;font-weight:600;}
.toolbar{display:flex;gap:8px;margin:0 16px 10px;flex-wrap:wrap;}
.tbtn{flex:1;min-width:80px;padding:10px;border-radius:12px;border:1.5px solid var(--input-border);background:var(--input-bg);color:var(--input-text);font-size:13px;font-weight:700;cursor:pointer;}
#menuGrid{margin:0 16px 20px;display:flex;flex-direction:column;gap:18px;}
.cat-title{font-size:15px;font-weight:800;color:var(--accent);margin:0 4px 10px;}
.cat-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:640px){.cat-grid{grid-template-columns:1fr 1fr;}}
.menu-card{position:relative;background:var(--card);border-radius:var(--radius);padding:28px 18px;text-align:center;box-shadow:var(--card-shadow);border:var(--card-border);cursor:pointer;user-select:none;}
.menu-card:active{transform:scale(0.97);}
.menu-icon{font-size:52px;margin-bottom:10px;display:block;}
.menu-title{font-size:20px;font-weight:800;color:var(--accent);}
.menu-sub{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.4;}
.star{position:absolute;top:10px;right:10px;background:none;border:none;font-size:20px;cursor:pointer;}
.recipe-photo{width:calc(100% - 32px);max-height:220px;object-fit:cover;border-radius:var(--radius);margin:16px auto 0;display:block;}
.card{background:var(--card);margin:16px;border-radius:var(--radius);padding:20px;box-shadow:var(--card-shadow);border:var(--card-border);}
.card h2{font-size:18px;color:var(--accent);margin-bottom:8px;font-weight:800;}
.hint{font-size:12px;color:var(--sub);margin-bottom:16px;}
.modes{display:flex;flex-direction:column;gap:16px;}
.mode-label{font-size:13px;font-weight:700;margin-bottom:8px;}
.mode-row{display:flex;gap:4px;background:var(--input-bg);padding:4px;border-radius:14px;border:1px solid var(--input-border);}
.mode-btn{flex:1;padding:10px;border-radius:10px;border:none;background:transparent;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;}
.mode-btn.active{background:var(--card);color:var(--accent);}
.ingredient{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:12px;}
.ingredient:last-child{border-bottom:none;}
.chk{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
.ingredient .emoji{font-size:22px;width:32px;text-align:center;}
.ingredient .info{flex:1;min-width:0;}
.ingredient .name{font-size:15px;font-weight:700;}
.ingredient .sub{font-size:11px;color:var(--sub);}
.ingredient .conv{font-size:11px;color:var(--accent2);font-weight:700;margin-top:2px;}
.ingredient input[type=text]{width:80px;padding:8px;font-size:16px;text-align:center;border:1.5px solid var(--input-border);border-radius:12px;background:var(--input-bg);color:var(--input-text);font-weight:800;}
.ingredient input:focus{outline:none;border-color:var(--accent);}
.ingredient .unit{font-size:12px;color:var(--sub);width:30px;font-weight:600;}
.ratio-badge{margin-top:16px;padding:16px;border-radius:14px;background:var(--spice-bg);border:1.5px solid var(--spice-border);color:var(--spice-text);font-size:15px;font-weight:800;text-align:center;}
.leaven-warn{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);border:1.5px solid var(--warn-border);color:var(--warn-text);font-size:12px;line-height:1.5;font-weight:600;}
.progress{font-size:12px;color:var(--sub);margin-top:12px;font-weight:700;text-align:right;}
.banner{text-align:center;font-size:14px;color:var(--text);margin:12px 16px;background:var(--card);padding:12px;border-radius:var(--radius);box-shadow:var(--card-shadow);font-weight:700;}
.banner b{color:var(--accent);font-size:16px;}
.yield{text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin:16px;padding:16px;border-radius:var(--radius);font-size:16px;font-weight:700;box-shadow:var(--btn-shadow);}
.btn{display:block;width:calc(100% - 32px);margin:12px 16px;padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--radius);font-size:16px;font-weight:800;cursor:pointer;box-shadow:var(--btn-shadow);user-select:none;}
.btn:active{transform:scale(0.98);}
.btn.secondary{background:var(--card);color:var(--accent);border:2px solid var(--accent);box-shadow:none;}
details{margin:12px 16px;background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--card-shadow);}
summary{font-size:16px;font-weight:700;cursor:pointer;user-select:none;}
.tips{font-size:13px;line-height:1.6;padding-top:12px;}
.tips li{margin:8px 0 8px 20px;}
.cost-row{padding:12px 0;border-bottom:1px solid var(--border);}
.cost-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px;}
.cost-amt{color:var(--sub);font-weight:400;font-size:12px;}
.cost-bottom{display:flex;align-items:center;gap:8px;}
.price-in{width:80px;padding:8px;border:1.5px solid var(--input-border);border-radius:10px;background:var(--input-bg);color:var(--input-text);text-align:center;font-size:14px;font-weight:700;}
.cost-unit{font-size:12px;color:var(--sub);}
.cost-line{margin-left:auto;font-size:14px;font-weight:800;color:var(--accent);}
.cost-total{margin-top:12px;padding-top:12px;border-top:2px dashed var(--border);font-size:16px;font-weight:800;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.full-recipe{background:var(--card);margin:16px;border-radius:var(--radius);padding:20px;box-shadow:var(--card-shadow);}
.full-recipe h2{font-size:18px;color:var(--accent);margin-bottom:16px;font-weight:800;}
.full-recipe .intro{font-size:14px;line-height:1.6;}
.full-recipe h3{font-size:15px;color:var(--accent);margin:16px 0 10px;font-weight:800;}
.step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.step:last-child{border-bottom:none;}
.step-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.step-body{flex:1;}
.step-title{font-weight:800;font-size:14px;margin-bottom:4px;}
.step-desc{font-size:13px;line-height:1.55;}
.step-desc b{color:var(--accent);}
.secrets{display:grid;gap:8px;margin-top:8px;}
.secret{padding:10px 12px;background:var(--spice-bg);border-left:4px solid var(--accent);border-radius:8px;font-size:13px;line-height:1.5;}
.problem-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.problem-tbl th,.problem-tbl td{border:1px solid var(--border);padding:8px;vertical-align:top;text-align:left;}
.problem-tbl th{background:var(--spice-bg);color:var(--spice-text);}
.problem-tbl td:first-child{font-weight:700;color:var(--warn-text);}
.serving{margin-top:16px;padding:12px;background:var(--spice-bg);border-radius:10px;font-size:13px;line-height:1.55;}
.cook-overlay,.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:120;padding:16px;}
.cook-box,.panel{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.cook-box h2,.panel h2{color:var(--accent);font-size:20px;margin-bottom:12px;font-weight:800;}
.panel h3{color:var(--accent);margin:12px 0 6px;}
.panel input,.panel textarea{width:100%;padding:10px;border:1.5px solid var(--input-border);border-radius:10px;background:var(--input-bg);color:var(--input-text);margin-bottom:8px;font-size:14px;}
.row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.row input{flex:1;min-width:56px;margin-bottom:0;padding:8px;border:1.5px solid var(--input-border);border-radius:10px;background:var(--input-bg);color:var(--input-text);}
.shop-item{padding:10px;border-bottom:1px solid var(--border);font-size:14px;display:flex;align-items:center;gap:8px;}
.cook-step{font-size:16px;line-height:1.5;min-height:60px;margin-bottom:12px;font-weight:600;}
.cook-timer{font-size:44px;font-weight:800;color:var(--accent2);margin:10px 0;font-variant-numeric:tabular-nums;}
.cook-controls{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
.cook-controls button{padding:12px 16px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;flex:1;}
.timer-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.next-btn{background:var(--bg);color:var(--text);}
.cook-progress{font-size:12px;color:var(--sub);margin-bottom:12px;font-weight:700;text-align:center;}
.cook-close{background:none;border:none;color:var(--sub);font-size:14px;cursor:pointer;padding:6px;font-weight:600;display:block;margin:0 auto;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.install-banner{position:fixed;bottom:20px;left:16px;right:16px;background:var(--card);padding:16px;border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:150;}
.install-banner p{font-size:14px;font-weight:600;margin-bottom:12px;}
.install-banner button{padding:10px 20px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-right:8px;}
.install-banner .install-btn{background:var(--accent);color:#fff;}
.install-banner .dismiss-btn{background:transparent;color:var(--sub);}
@media print{.header,.install-banner,.toast,#screen-menu,.toolbar,.search-wrap,.btn,details,.cook-overlay,.panel-overlay,.theme-switch,.star,.back-btn{display:none!important;}body{background:#fff;color:#000;padding:0;}#screen-recipe{display:block!important;}.card,.full-recipe{box-shadow:none;border:1px solid #bbb;margin:8px 0;}.ingredient input[type=text]{border:none;background:none;}}
</style>
</head>
<body class="theme-classic">
<div class="header">
  <button class="back-btn" id="backBtn" onclick="Eng.toMenu()">← Меню</button>
  <span class="ver">v11.3</span>
  <h1 id="mainTitle">📖 Кулинарная книга</h1>
  <p id="mainSub">Выберите категорию и рецепт</p>
  <div class="theme-switch">
    <button class="t-btn" data-theme="classic" onclick="setTheme('classic')">🌶 Классика</button>
    <button class="t-btn" data-theme="asian" onclick="setTheme('asian')">🏮 Азия</button>
    <button class="t-btn" data-theme="dark" onclick="setTheme('dark')">🖤 Премиум</button>
    <button class="t-btn" data-theme="eco" onclick="setTheme('eco')">🌿 Эко</button>
  </div>
</div>

<div id="screen-menu" class="screen active">
  <div class="search-wrap"><input id="searchInput" type="text" placeholder="🔍 Поиск: название или ингредиент…" oninput="Eng.buildMenu(this.value)"></div>
  <div class="toolbar">
    <button class="tbtn" onclick="Eng.openPanel('panelAdd')">➕ Рецепт</button>
    <button class="tbtn" onclick="Eng.openPanel('panelShop');Eng.renderShop()">🛒 Покупки</button>
    <button class="tbtn" onclick="Eng.openPanel('panelPantry');Eng.renderPantry()">🧊 Кладовая</button>
    <button class="tbtn" onclick="Eng.openPanel('panelBackup')">💾 Бэкап</button>
  </div>
  <div id="menuGrid"></div>
</div>

<div id="screen-recipe" class="screen"><div id="recipeBox"></div></div>
<div class="toast" id="toast"></div>

<div class="panel-overlay" id="panelShop" onclick="if(event.target===this)Eng.closePanel('panelShop')"><div class="panel"><h2>🛒 Список покупок</h2><div id="shopList"></div><button class="btn" onclick="Eng.copyShop()">📋 Скопировать</button><button class="btn secondary" onclick="Eng.closePanel('panelShop')">Закрыть</button></div></div>

<div class="panel-overlay" id="panelAdd" onclick="if(event.target===this)Eng.closePanel('panelAdd')"><div class="panel"><h2>➕ Новый рецепт</h2>
<input id="addTitle" placeholder="Название блюда">
<input id="addCat" placeholder="Категория (напр. 🍽 Домашние)">
<input id="addIcon" placeholder="Эмодзи (напр. 🍲)" style="max-width:90px">
<textarea id="addIntro" rows="2" placeholder="Короткое описание"></textarea>
<h3>🥘 Состав</h3><div id="addIng"></div><button class="tbtn" onclick="Eng.addIngRow()">+ ингредиент</button>
<h3>👩 Шаги</h3><div id="addSteps"></div><button class="tbtn" onclick="Eng.addStepRow()">+ шаг</button>
<button class="btn" onclick="Eng.saveRecipe()">💾 Сохранить рецепт</button>
<button class="btn secondary" onclick="Eng.closePanel('panelAdd')">Закрыть</button></div></div>

<div class="panel-overlay" id="panelPantry" onclick="if(event.target===this)Eng.closePanel('panelPantry')"><div class="panel"><h2>🧊 Кладовая</h2>
<div class="row"><input id="panName" placeholder="Что заготовили"><input id="panDays" type="number" placeholder="Срок, дней" style="max-width:90px"><button class="tbtn" onclick="Eng.pantryAdd()">+</button></div>
<div id="panList"></div>
<button class="btn secondary" onclick="Eng.closePanel('panelPantry')">Закрыть</button></div></div>

<div class="panel-overlay" id="panelBackup" onclick="if(event.target===this)Eng.closePanel('panelBackup')"><div class="panel"><h2>💾 Резервная копия</h2>
<button class="btn" onclick="Eng.exportBackup()">⬇️ Скачать копию</button>
<label class="btn secondary" style="display:block;text-align:center">⬆️ Загрузить копию<input type="file" accept=".json" style="display:none" onchange="Eng.importBackup(this.files[0])"></label>
<button class="btn secondary" onclick="Eng.closePanel('panelBackup')">Закрыть</button></div></div>

<div class="panel-overlay" id="panelPhoto" onclick="if(event.target===this)Eng.closePanel('panelPhoto')"><div class="panel" style="max-width:320px"><h2>📸 Фото рецепта</h2>
<button class="btn" onclick="Eng.pickPhoto('cam')">📷 Сделать фото</button>
<button class="btn secondary" onclick="Eng.pickPhoto('gal')">🖼 Выбрать из галереи</button>
<button class="btn secondary" onclick="Eng.removePhoto()">🗑 Убрать фото</button>
<button class="btn secondary" onclick="Eng.closePanel('panelPhoto')">Закрыть</button></div></div>

<div class="install-banner" id="installBanner">
  <p>📱 Установить приложение на телефон?</p>
  <button class="install-btn" id="installBtn">Установить</button>
  <button class="dismiss-btn" id="dismissBtn">Позже</button>
</div>

<script>
const fmt=(v,d)=>{if(!isFinite(v))v=0;return Math.round(v*Math.pow(10,d))/Math.pow(10,d);};
const num=v=>{v=parseFloat(String(v).replace(',','.'));return isFinite(v)?v:0;};
const val=id=>document.getElementById(id).value;
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let FAV=LS.get('fav',[]),CUSTOM=LS.get('custom',[]),PANTRY=LS.get('pantry',[]),REM=LS.get('rem',[]),PHOTOS=LS.get('photos',{});
function setTheme(t){document.body.className='theme-'+t;document.querySelectorAll('.t-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===t));try{localStorage.setItem('appTheme',t);}catch(e){}}
function toast(m){const x=document.getElementById('toast');x.textContent=m;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),2500);}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy');toast('📋 Скопировано!');}catch(e){toast('❌ Ошибка');}document.body.removeChild(a);}
function doCopy(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('📋 Скопировано!')).catch(()=>fallbackCopy(t));}else{fallbackCopy(t);}}
function ensureNotif(){if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();}

document.getElementById('screen-menu').classList.remove('active');document.getElementById('screen-recipe').classList.add('active');document.getElementById('backBtn').style.display='block';document.getElementById('mainTitle').textContent=r.icon+' '+r.title;document.getElementById('mainSub').textContent=r.sub||'';
this.buildCost(r);this.load(r);this.refresh(r);this.refreshPhoto(r);window.scrollTo(0,0);},
refreshPhoto(r){const el=this.R(r,'photo');if(!el)return;if(PHOTOS[r.id]){el.src=PHOTOS[r.id];el.style.display='block';}else{el.style.display='none';}},
attachPhoto(r){this._photoTarget=r.id;this.openPanel('panelPhoto');},
pickPhoto(mode){const id=this._photoTarget;const r=this.find(id);const inp=document.createElement('input');inp.type='file';inp.accept='image/*';if(mode==='cam')inp.setAttribute('capture','environment');inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,600/img.width);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);PHOTOS[id]=c.toDataURL('image/jpeg',0.7);LS.set('photos',PHOTOS);Eng.closePanel('panelPhoto');Eng.refreshPhoto(r);toast('📸 Фото добавлено');};img.src=rd.result;};rd.readAsDataURL(f);};inp.click();},

shareCard(r){const items=this.visible(r);const H=220+items.length*44+120;const c=document.createElement('canvas');c.width=800;c.height=H;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,800,H);g.addColorStop(0,'#c1121f');g.addColorStop(1,'#ff8500');x.fillStyle=g;x.fillRect(0,0,800,H);x.fillStyle='#fff';x.font='bold 52px sans-serif';x.fillText(r.icon+' '+r.title,40,80);x.font='28px sans-serif';let y=150;items.forEach(i=>{x.fillText(`${i.emoji} ${this.name(i,r.state)}: ${this.inp(r,i.key).value} ${i.unit}`,40,y);y+=44;});if(r.yield)x.fillText(r.yield(r).replace(/<[^>]+>/g,''),40,y+10);const a=document.createElement('a');a.download=r.id+'-card.png';a.href=c.toDataURL('image/png');a.click();toast('📤 Карточка сохранена');},
setIf(r,k,v){const i=this.inp(r,k);if(document.activeElement!==i)i.value=fmt(v,1);},
valueFor(r,i){if(r.couple){const pct=r.slider?r.state[r.slider.key]:50,t=r.couple.total*r.factor;if(i.key===r.couple.a)return t*pct/100;if(i.key===r.couple.b)return t-t*pct/100;}return this.base(i,r.state)*r.factor;},
recalc(id,key,v){const r=this.find(id);v=num(v);if(v<=0)return;if(r.couple&&(key===r.couple.a||key===r.couple.b)){const a=num(this.inp(r,r.couple.a).value),b=num(this.inp(r,r.couple.b).value),t=a+b;if(t<=0)return;r.factor=t/r.couple.total;if(r.slider){r.state[r.slider.key]=Math.round(a/t*100);this.R(r,'slider').value=r.state[r.slider.key];}}else{const B={};this.visible(r).forEach(i=>B[i.key]=this.base(i,r.state));r.factor=v/B[key];}if(!isFinite(r.factor)||r.factor<=0)return;this.refresh(r);},

refresh(r){this.visible(r).forEach(i=>this.setIf(r,i.key,this.valueFor(r,i)));if(r.slider&&r.slider.label)this.R(r,'sLabel').textContent=r.slider.label(r.state);document.querySelectorAll('.mode-btn').forEach(b=>{if(this.cur===r)b.classList.toggle('active',r.state[b.dataset.mk]===b.dataset.mv);});r.ingredients.forEach(i=>{const row=this.R(r,'row_'+i.key);if(row)row.style.display=(!i.visible||i.visible(r.state))?'flex':'none';const nm=this.R(r,'name_'+i.key);if(nm)nm.textContent=this.name(i,r.state);const cv=this.R(r,'conv_'+i.key);const c=this.conv(i,r.state);if(cv&&c){cv.textContent=`${fmt(num(this.inp(r,i.key).value),1)} ${i.unit} ≈ ${fmt(num(this.inp(r,i.key).value)/c.per,1)} ${c.u}`;}});if(r.badge)this.R(r,'badge').textContent=r.badge(r);const w=this.R(r,'warn');if(w){const t=r.warning?r.warning(r):null;w.style.display=t?'block':'none';if(t)w.textContent=t;}this.R(r,'mult').textContent=r.factor.toFixed(2);if(r.yield)this.R(r,'yield').innerHTML=r.yield(r);this.R(r,'prog').textContent=`🍳 ✓ ${r.checked.size} из ${this.visible(r).length}`;this.updCost(r);this.save(r);},
updCost(r){let t=0;this.visible(r).forEach(i=>{const p=num(this.R(r,'price_'+i.key).value),a=num(this.inp(r,i.key).value);const c=(i.unit==='шт')?a*p:(a/1000*p);t+=c;this.R(r,'camt_'+i.key).textContent=`${fmt(a,1)} ${i.unit}`;this.R(r,'cline_'+i.key).textContent=c>0?`${c.toFixed(1)} ₽`:'—';});this.R(r,'costTotal').textContent=`Итого: ${fmt(t,0)} ₽`;const j=num(this.inp(r,'jars').value),f=num(this.inp(r,'mackerel').value);this.R(r,'costPer100').textContent=j?`≈ ${fmt(t/j,1)} ₽/банку`:(f?`≈ ${fmt(t/f,1)} ₽/тушку`:'');},
buildCost(r){const w=this.R(r,'costRows');w.innerHTML='';r.ingredients.forEach(i=>{const p=r.prices&&r.prices[i.key]||0,u=i.unit==='г'?'кг':(i.unit==='мл'?'л':'шт');const n=typeof i.name==='string'?i.name:(typeof i.name==='function'?i.name(r.state):'');w.insertAdjacentHTML('beforeend',`<div class="cost-row"><div class="cost-top"><span>${i.emoji} ${n}</span><span class="cost-amt" id="${r.id}_camt_${i.key}"></span></div><div class="cost-bottom"><input type="text" inputmode="decimal" class="price-in" id="${r.id}_price_${i.key}" value="${p}" oninput="Eng.updCost(Eng.find('${r.id}'));Eng.save(Eng.find('${r.id}'))"><span class="cost-unit">₽/${u}</span><span class="cost-line" id="${r.id}_cline_${i.key}"></span></div></div>`);});},

load(r){let s;try{s=JSON.parse(localStorage.getItem('rc_'+r.id));}catch(e){}if(!s)return;if(s.f)r.factor=s.f;if(s.st)Object.assign(r.state,s.st);if(s.c)r.checked=new Set(s.c);if(s.p)r.ingredients.forEach(i=>{const e=this.R(r,'price_'+i.key);if(e&&s.p[i.key]!==undefined)e.value=s.p[i.key];});if(r.slider&&this.R(r,'slider'))this.R(r,'slider').value=r.state[r.slider.key];},

openCook(id){const r=this.find(id);r.cookStep=0;this.R(r,'cook').style.display='flex';this.showStep(r);},
closeCook(id){const r=this.find(id);this.R(r,'cook').style.display='none';this.stopTimer(r);if('speechSynthesis' in window)speechSynthesis.cancel();},
showStep(r){const s=r.steps[r.cookStep];this.R(r,'stepT').textContent=s.t;this.R(r,'stepP').textContent=`Шаг ${r.cookStep+1} из ${r.steps.length}`;this.stopTimer(r);if(s.tm>0){r.tmTot=s.tm;r.tmRem=s.tm;this.renderTm(r);this.R(r,'tBtn').style.display='block';this.R(r,'tBtn').textContent='▶ Старт';}else{this.R(r,'timer').textContent='—';this.R(r,'tBtn').style.display='none';}},
nextStep(id){const r=this.find(id);if(r.cookStep<r.steps.length-1){r.cookStep++;this.showStep(r);}else{this.closeCook(id);toast('🎉 Готово!');}},
renderTm(r){const m=Math.floor(r.tmRem/60),s=r.tmRem%60;this.R(r,'timer').textContent=`${m}:${s.toString().padStart(2,'0')}`;},
toggleTimer(id){const r=this.find(id);r.timerRunning?this.stopTimer(r):this.startTimer(r);},
startTimer(r){ensureNotif();if(r.tmRem<=0)r.tmRem=r.tmTot;r.timerRunning=true;r.endTime=Date.now()+r.tmRem*1000;this.R(r,'tBtn').textContent='⏸ Пауза';r.tmInt=setInterval(()=>{r.tmRem=Math.max(0,Math.round((r.endTime-Date.now())/1000));this.renderTm(r);if(r.tmRem<=0){this.stopTimer(r);this.doneTm(r);}},250);},
stopTimer(r){r.timerRunning=false;if(r.tmInt){clearInterval(r.tmInt);r.tmInt=null;}const b=this.R(r,'tBtn');if(b&&b.style.display!=='none')b.textContent='▶ Старт';},
doneTm(r){beep();try{navigator.vibrate([200,100,200]);}catch(e){}this.R(r,'timer').textContent='✅';this.R(r,'tBtn').style.display='none';toast('⏰ Время вышло!');notify('⏰ Время вышло!',r.title);},
};
CUSTOM.forEach(r=>RECIPES.push(r));
try{const t=localStorage.getItem('appTheme');if(t)setTheme(t);}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
Eng.buildMenu('');Eng.checkRem();Eng.checkPantry();
let deferredPrompt;const installBanner=document.getElementById('installBanner');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBanner.style.display='block';});
document.getElementById('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBanner.style.display='none';});
document.getElementById('dismissBtn').addEventListener('click',()=>{installBanner.style.display='none';});
</script>
